name: Build Web App

permissions:
  contents: write

on:
  push:
    branches: [ main ]
    tags: ['v*']
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (npm)
        run: |
          npm ci --no-optional
          npm rebuild

      - name: Install Rollup native binary (Linux)
        if: runner.os == 'Linux'
        run: |
          npm i --no-save @rollup/rollup-linux-x64-gnu || true

      - name: Build (web)
        run: npm run build

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: dist

  tauri-build-windows:
    needs: build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal

      - name: Install dependencies (npm)
        shell: pwsh
        run: |
          npm ci --no-optional
          npm rebuild

      - name: Install Rollup native binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          npm i --no-save @rollup/rollup-win32-x64-msvc || true

      - name: Build web assets
        run: npm run build

      - name: Build Tauri (Windows)
        run: npm run tauri build

      - name: List Tauri bundle contents
        shell: pwsh
        run: |
          if (Test-Path 'src-tauri/target/release/bundle') { Get-ChildItem -Recurse 'src-tauri/target/release/bundle' | Select-Object FullName } else { Write-Error 'Tauri bundle folder not found' }

      - name: Upload Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: tauri-windows
          path: src-tauri/target/release/bundle

      - name: Collect Windows program EXE
        shell: pwsh
        run: |
          $releaseDir = "release-assets/program"
          New-Item -ItemType Directory -Force $releaseDir | Out-Null

          $exe = Get-ChildItem 'src-tauri/target/release' -Filter *.exe |
            Where-Object { $_.Name -notmatch 'updater' } |
            Select-Object -First 1

          if (-not $exe) {
            throw "No Windows program EXE found in target/release"
          }

          Copy-Item $exe.FullName $releaseDir

      - name: Upload Windows program EXE
        uses: actions/upload-artifact@v4
        with:
          name: windows-program-exe
          path: release-assets/program/*.exe

      - name: Collect Windows installer EXE
        shell: pwsh
        run: |
          $releaseDir = "release-assets/installer"
          New-Item -ItemType Directory -Force $releaseDir | Out-Null

          $exe = Get-ChildItem -Recurse 'src-tauri/target/release/bundle/nsis' -Filter *.exe |
            Where-Object { $_.Name -notmatch 'updater' } |
            Select-Object -First 1

          if (-not $exe) {
            throw "No Windows installer EXE found in bundle/nsis"
          }

          Copy-Item $exe.FullName $releaseDir

      - name: Upload Windows installer EXE
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-exe
          path: release-assets/installer/*.exe

  publish-release:
    needs: [build, tauri-build-windows]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download web build artifact
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: dist

      - name: Download tauri Windows bundle
        uses: actions/download-artifact@v4
        with:
          name: tauri-windows
          path: windows

      - name: Download Windows program EXE
        uses: actions/download-artifact@v4
        with:
          name: windows-program-exe
          path: release-assets/program

      - name: Download Windows installer EXE
        uses: actions/download-artifact@v4
        with:
          name: windows-installer-exe
          path: release-assets/installer

      - name: Archive web build
        run: |
          cd dist
          zip -r ../web-build.zip .

      - name: Archive Windows bundle
        run: |
          cd windows
          zip -r ../tauri-windows.zip .

      - name: Create GitHub Release and upload artifacts
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          artifacts: "web-build.zip,tauri-windows.zip,release-assets/program/*.exe,release-assets/installer/*.exe"
